- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Ground-truth odometry, EVALUATION ONLY - never the robot's odometry source.
# Its TF (odom -> base_footprint) is deliberately NOT bridged: that transform
# belongs to visual odometry once RGB-D SLAM is running, and feeding perfect
# simulator poses into TF would mask the drift we need to measure.
- ros_topic_name: "/odom_ground_truth"
  gz_topic_name: "/model/Hexapod_Robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# IMU (simulated BNO055) -> ROS sensor_msgs/Imu on /imu.
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# RGB-D camera. One Gazebo rgbd_camera sensor feeds all four topics; colour and
# depth are rendered together, so their stamps match frame for frame.
- ros_topic_name: "/face_camera/image"
  gz_topic_name: "/face_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/face_camera/camera_info"
  gz_topic_name: "/face_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth image: 32-bit float metres, same optics and stamp as the colour frame.
- ros_topic_name: "/face_camera/depth_image"
  gz_topic_name: "/face_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Organised point cloud straight from the sensor - no extra processing node.
- ros_topic_name: "/face_camera/points"
  gz_topic_name: "/face_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Per-foot contact sensors -> ROS ros_gz_interfaces/Contacts on /contact/leg_*.
- ros_topic_name: "/contact/leg_l1"
  gz_topic_name: "/contact/leg_l1"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/contact/leg_l2"
  gz_topic_name: "/contact/leg_l2"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/contact/leg_l3"
  gz_topic_name: "/contact/leg_l3"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/contact/leg_r1"
  gz_topic_name: "/contact/leg_r1"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/contact/leg_r2"
  gz_topic_name: "/contact/leg_r2"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/contact/leg_r3"
  gz_topic_name: "/contact/leg_r3"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS