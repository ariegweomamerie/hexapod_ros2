# ros2_control controller configuration for the hexapod.
# Loaded by the gz_ros2_control plugin (see Hexapod_Robot.gazebo).
#
# - joint_state_broadcaster: publishes /joint_states for all joints
# - leg_controller:  JointTrajectoryController over the 18 leg joints
# - face_controller: JointTrajectoryController over the 2 pan/tilt joints
#
# JointTrajectoryController is used (not a plain forward controller) because the
# gait generator will send interpolated trajectories to these controllers later.

# Simulated servo response. gz_ros2_control turns each position command into a joint
# velocity: v = gain * error * update_rate. The default 0.1 gives a ~0.1 s time
# constant, far slower than a hobby servo; the legs then lag ~0.1 s and drag their
# planted feet when the gait stops. 0.3 gives ~33 ms and stays well inside the stable
# range (gain < 1 converges without overshoot).
# This needs soft joint limits: at 0.3, a gravity-loaded joint driven exactly onto its
# URDF hard stop locks up in the physics engine (face_tilt did, 2/2). The gait IK and
# the head node therefore keep every command 0.02 rad inside the URDF limits.
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.3


controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    face_controller:
      type: joint_trajectory_controller/JointTrajectoryController

leg_controller:
  ros__parameters:
    joints:
      - leg_l1_coxa
      - leg_l1_femur
      - leg_l1_tibia
      - leg_l2_coxa
      - leg_l2_femur
      - leg_l2_tibia
      - leg_l3_coxa
      - leg_l3_femur
      - leg_l3_tibia
      - leg_r1_coxa
      - leg_r1_femur
      - leg_r1_tibia
      - leg_r2_coxa
      - leg_r2_femur
      - leg_r2_tibia
      - leg_r3_coxa
      - leg_r3_femur
      - leg_r3_tibia
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # The gait streams a new short trajectory every 20 ms. Start each one from the
    # last DESIRED state, not the measured one: interpolating from the (always
    # slightly lagging) measured state re-anchors the reference every message,
    # which delayed it ~160 ms and executed only ~1/3 of the planned leg motion.
    interpolate_from_desired_state: true

face_controller:
  ros__parameters:
    joints:
      - face_pan
      - face_tilt
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
